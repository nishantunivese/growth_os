name: Build Growth OS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and Re-generate Official Android Project
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.growthos.app
          python3 prepare_android.py
          echo "=== Patched build file check ==="
          cat android/app/build.gradle* | grep -E "minSdk|multiDex|compileSdk"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowthOS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
