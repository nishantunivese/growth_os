name: growth_os
description: "GROWTH OS - Premium Android Business & Productivity Command Center for Online Entrepreneurs, Creators & Digital Marketers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend & Database
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts & Visuals
  fl_chart: ^0.68.0

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # Media & Hardware
  image_picker: ^1.1.1
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Notifications & Scheduling
  flutter_local_notifications: ^17.1.2

  # Document Generation & Export
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Security & Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

